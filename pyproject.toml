[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojomdanalysis"
version = "0.1.0"
description = "MDAnalysis trajectory geometry kernels implemented in Mojo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
